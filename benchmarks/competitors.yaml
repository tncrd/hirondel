# Models we run ourselves, under our protocol, through the same adapter as our model (benchmarks/adapter.py).
# Written on 2026-10-22, before any of them was scored. The list is fixed here and not chosen after seeing results.
#
# Selection rule: recent pretrained forecasting models with public weights and a public package, that are either
# reference points on the public leaderboards or close to our size (up to about 30M parameters). The list is:
# Timestral-5M and 28M, Chronos-2, TiRex, TimesFM-2.5 and Toto-2.0-22m.
#
# Protocol: forced univariate. Each target series is forecast on its own, without covariates and without information
# from other series. The context is the model's own default maximum, the quantile levels are 0.1 ... 0.9, and each
# model uses its public package with the settings documented on its model card. Each model runs in its own
# environment, and downloaded weights are loaded without pickle when the format allows it. These numbers are labelled
# "same protocol, computed by us". They are not the leaderboards' official numbers, which may use joint or covariate
# modes.
#
# Size: the parameter count stated by the official model card (card_statement). When the Hub's safetensors metadata
# gives an exact count it is recorded too (hub_count). Revision: the Hub commit read on 2026-10-22, pinned for the run.

