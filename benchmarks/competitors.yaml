  - name: Toto-2.0-22m
    repo_id: Datadog/Toto-2.0-22m
    revision: 685e4ae3e2be8d8998025e53dd98e7fdcb296a89
    card_statement: "21.9M params"
    hub_count: 21915584
    license: Apache-2.0
