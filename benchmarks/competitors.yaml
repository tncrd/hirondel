# Amendment, 2026-10-22, before any score: on GIFT-Eval, TiRex runs from NX-AI/TiRex-1.1-gifteval (revision
# 01b1ebc83a87e82b119f907fe7e43d015db23e9d), the checkpoint of TiRex's leaderboard entry and official notebook,
# whose card says "the pretraining dataset has been cleaned to remove overlaps with the GIFT-Eval test dataset".
# The card of NX-AI/TiRex does not say this, so scoring it on GIFT-Eval could count training data as test data.
# Same size and same license.
gift_eval_overrides:
  TiRex:
    repo_id: NX-AI/TiRex-1.1-gifteval
    revision: 01b1ebc83a87e82b119f907fe7e43d015db23e9d
    source: https://huggingface.co/NX-AI/TiRex-1.1-gifteval

# Amendment, 2026-10-22 (user decision), after the first TiRex score: TiRex also gets a second line, "TiRex
# (resampling)", with resample_strategy="frequency" as in its official GIFT-Eval notebook. It is the setting of TiRex's
# leaderboard entry. It is added as a second line next to the card's default setting, which is not replaced.
gift_eval_variants:
  TiRex: [resample]

# Amendment, 2026-10-22 (user decision): the "TiRex (resampling)" run is cancelled because it is too long (about
# 2.5 hours on our GPU). The variant stays in the code; the only TiRex line computed by us is the card's default setting.
# TiRex's leaderboard number (with resampling) can be shown as an official number.

# Amendment, 2026-10-22, 22:30 (user decision), before any fev-bench or TIME score of a competitor: the forced-univariate
# comparison is extended to fev-bench and TIME for the models whose official numbers there come from joint multivariate
# forecasting and/or covariates (Chronos-2, Toto-2.0, Timestral). TiRex and TimesFM-2.5 forecast each series alone by
# design; their official fev-bench and TIME numbers are already in the univariate setting and are used as they are.
#
# Amendment, 2026-10-23 (user decision), after the scores above, to complete the univariate figure with the models of the
# official figure. Univariate by design, read in their own sources, official numbers used as they are:
#   - FlowState-r1.1: "While datasets are treated as univariate series, and therefore predictions always have only one
#     channel" (arXiv 2508.05287, appendix; the r1.1 card changes data, context and layer sizes, not this).
#   - Moirai-2.0-small: "Currently, Moirai 2.0 is designed for univariate time-series input." and "we have dropped
#     support for multivariate forecasting and the use of covariates" (arXiv 2511.11698, sections 3.1 and 5).
# Run by us in forced univariate mode on the three benchmarks: Toto-2.0-4m (multivariate, like Toto-2.0-22m), the only
# other model with a permissive license under 10M parameters.
# Not in the univariate setting, shown in the official figure only: TimesFM-3 ("TimesFM 3.0 introduces native
# multivariate time-series forecasting, flexible covariate support", github.com/google-research/timesfm) and t0-gamma
# (target history, past and known-future covariates, its technical report); a forced run of either (256M-331M) does
# not fit the release day.
fev_time_univariate_runs: [Chronos-2, Toto-2.0-22m, Timestral-5M, Timestral-28M, Toto-2.0-4m]
natively_univariate: [TiRex, TimesFM-2.5, FlowState-r1.1, Moirai-2.0-small]

# Amendment, 2026-10-23 (user decision), after IND-Eval scores of our model and of Timestral-5M only: IND-Eval is run
# in forced univariate mode for every model of the list above, so that the IND-Eval comparison has one table where all
# models are in the same setting (the paper's numbers are joint forecasting with covariates). The list is unchanged;
# TiRex here is NX-AI/TiRex (TiRex 1), and TimesFM-2.5 stands where the paper has TimesFM-3. Timestral-5M's run was
# made earlier the same day, with the same harness.
indeval_univariate_runs: [Timestral-5M, Timestral-28M, Chronos-2, TiRex, TimesFM-2.5, Toto-2.0-22m, Toto-2.0-4m]
