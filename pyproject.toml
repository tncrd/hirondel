[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "hirondel"
version = "1.0.0"
dynamic = ["readme"]
description = "Zero-shot time-series forecasting model (7M parameters)"
authors = [{ name = "The Hirondel Author" }]
keywords = ["forecasting", "time-series", "foundation-model"]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "DATA.md"]
dependencies = [
    "torch>=2.4",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/tncrd/hirondel"
Repository = "https://github.com/tncrd/hirondel"
"Model weights" = "https://huggingface.co/Tncrd/Hirondel-7M"

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]
bench = ["gluonts==0.16.3", "pandas"]   # plus gift-eval from its repository, see benchmarks/gift.py

[tool.hatch.build.targets.wheel]
packages = ["src/hirondel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# PyPI does not host the figures: on the PyPI page only, the README's relative image paths point to the release tag on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="showcase/'
replacement = 'src="https://raw.githubusercontent.com/tncrd/hirondel/v1.0.0/showcase/'
