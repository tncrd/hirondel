# against every leaderboard entry separately (see showcase/README.md).
#
# params: exact count from the Hub's safetensors metadata when it exists, otherwise the model card's statement.
# Sizes, licenses and revisions read on 2026-10-22 (GIFT-Eval results re-read on 2026-10-23 at gift-eval cfaefe0, which adds
# Timestral, merged on 2026-10-16). Result keys: the model's name in each leaderboard's published results
# (gift: results/<key>/all_results.csv of gift-eval; fev: model_name in fev's results; time: results/<key>/ of
# Real-TSF/TIME-Output). null = not on that leaderboard.

