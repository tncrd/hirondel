name: ci

on:
  push:
  pull_request:

jobs:
  # The torch version the reference was computed with, one thread (set by the test). Strict 1e-6 parity is reported,
  # not required: GitHub's runners miss it by about 1e-6 sigma with the same torch.
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch, reference version)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.12.1" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,pandas]"
      - name: Test
        env:
          HIRONDEL_WEIGHTS: ${{ vars.HIRONDEL_WEIGHTS }}
        run: pytest -v --deselect tests/test_parity.py::test_forecast_matches_reference
      - name: Parity gap (reported)
        continue-on-error: true
        env:
          HIRONDEL_WEIGHTS: ${{ vars.HIRONDEL_WEIGHTS }}
        run: pytest -v tests/test_parity.py
      - name: Build sdist and wheel
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build
          python -c "import zipfile, glob; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(x.endswith('licenses/LICENSE') for x in n), n"

  # Oldest supported torch, without pandas (forecast_df tests skip): everything must pass; the parity gap is
  # reported, not required.
  test-min-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU-only torch 2.4)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.4.1" "numpy<2" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Test
        run: pytest -v --deselect tests/test_parity.py::test_forecast_matches_reference
      - name: Parity gap (reported)
        continue-on-error: true
        env:
          HIRONDEL_WEIGHTS: ${{ vars.HIRONDEL_WEIGHTS }}
        run: pytest -v tests/test_parity.py
